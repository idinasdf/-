<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วันนี้รู้สึกยังไง?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#EEF1EE;
    --paper-deep:#E3E8E2;
    --ink:#20261F;
    --ink-soft:#5B6459;
    --line: rgba(32,38,31,0.12);

    --calm:#6E97A0;
    --calm-soft:#DCE7E8;
    --happy:#E5A438;
    --happy-soft:#F7E8CC;
    --angry:#BF5136;
    --angry-soft:#F1DAD2;
    --sad:#5C6A8C;
    --sad-soft:#DFE2EC;

    --radius: 22px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, var(--paper-deep) 0%, transparent 45%),
      radial-gradient(circle at 88% 92%, var(--paper-deep) 0%, transparent 40%);
    font-family:'Inter', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 16px;
  }

  .card{
    width:100%;
    max-width: 440px;
  }

  .eyebrow{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 6px 2px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(30px, 7vw, 38px);
    line-height:1.15;
    margin: 0 0 28px 2px;
  }
  h1 em{
    font-style: italic;
    font-weight:500;
  }

  .field-row{
    display:flex;
    gap:10px;
    margin-bottom: 12px;
  }

  .field{
    flex:1;
    min-width:0;
  }

  label{
    display:block;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 6px 4px;
  }

  input[type=text]{
    width:100%;
    padding: 13px 15px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: #fff;
    font-family:'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]:focus{
    border-color: var(--calm);
    box-shadow: 0 0 0 4px var(--calm-soft);
  }
  input[type=text]::placeholder{ color:#A7AEA3; }

  .moods{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 24px 0 6px;
  }

  .mood-btn{
    position:relative;
    border:none;
    cursor:pointer;
    border-radius: var(--radius);
    padding: 20px 14px 16px;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background: var(--tint);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    transition: transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mood-btn:active{ transform: scale(0.97); }
  .mood-btn:disabled{ opacity:.45; cursor:not-allowed; }

  .mood-btn svg{ width:30px; height:30px; }

  .mood-btn .label{
    font-weight:600;
    font-size: 15.5px;
  }

  .mood-btn.calm{ --tint: var(--calm-soft); }
  .mood-btn.happy{ --tint: var(--happy-soft); }
  .mood-btn.angry{ --tint: var(--angry-soft); }
  .mood-btn.sad{ --tint: var(--sad-soft); }

  .mood-btn.calm svg{ color: var(--calm); }
  .mood-btn.happy svg{ color: var(--happy); }
  .mood-btn.angry svg{ color: var(--angry); }
  .mood-btn.sad svg{ color: var(--sad); }

  .mood-btn.selected{
    box-shadow: 0 0 0 2.5px var(--sel-color, var(--ink)) inset;
  }
  .mood-btn.calm.selected{ --sel-color: var(--calm); }
  .mood-btn.happy.selected{ --sel-color: var(--happy); }
  .mood-btn.angry.selected{ --sel-color: var(--angry); }
  .mood-btn.sad.selected{ --sel-color: var(--sad); }

  .hint{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 14px 4px 0;
    min-height: 18px;
  }
  .hint.error{ color: var(--angry); }

  .submit-row{ margin-top: 18px; }

  button.submit{
    width:100%;
    padding: 15px;
    border:none;
    border-radius: 14px;
    background: var(--ink);
    color: var(--paper);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 15.5px;
    cursor:pointer;
    transition: opacity .15s ease, transform .15s ease;
  }
  button.submit:disabled{ opacity:.4; cursor:not-allowed; }
  button.submit:active:not(:disabled){ transform: scale(0.985); }

  /* ---- Success state ---- */
  .success{
    display:none;
    text-align:center;
    padding: 20px 6px 6px;
  }
  .success.show{ display:block; animation: rise .5s cubic-bezier(.2,.8,.2,1); }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .success-icon{
    width:64px; height:64px;
    border-radius:50%;
    margin: 0 auto 20px;
    display:flex; align-items:center; justify-content:center;
    background: var(--tint, var(--calm-soft));
  }
  .success-icon svg{ width:30px; height:30px; color: var(--col, var(--calm)); }

  .success h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 24px;
    margin: 0 0 8px;
  }
  .success p{
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 0;
    line-height:1.5;
  }

  .form-wrap{ transition: opacity .3s ease; }
  .form-wrap.hide{ display:none; }

  .footnote{
    text-align:center;
    font-size:12px;
    color: var(--ink-soft);
    margin-top: 22px;
    opacity:.7;
  }
</style>
</head>
<body>

<div class="card">
  <div class="form-wrap" id="formWrap">
    <p class="eyebrow" id="todayLabel"></p>
    <h1>วันนี้<br><em>รู้สึก</em>ยังไงบ้าง?</h1>

    <div class="field-row">
      <div class="field">
        <label for="sname">ชื่อ - นามสกุล</label>
        <input type="text" id="sname" placeholder="เช่น สมชาย ใจดี" autocomplete="off">
      </div>
      <div class="field" style="max-width:110px;">
        <label for="sno">เลขที่</label>
        <input type="text" id="sno" placeholder="เช่น 12" inputmode="numeric" autocomplete="off">
      </div>
    </div>

    <div class="moods" id="moods">
      <button type="button" class="mood-btn calm" data-mood="calm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 1.3 3.5 1.3 3.5-1.3 3.5-1.3"/><circle cx="9" cy="9.5" r=".6" fill="currentColor" stroke="none"/><circle cx="15" cy="9.5" r=".6" fill="currentColor" stroke="none"/></svg>
        <span class="label">สงบ</span>
      </button>
      <button type="button" class="mood-btn happy" data-mood="happy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M7.5 13.5c0 2.5 2 4 4.5 4s4.5-1.5 4.5-4"/><circle cx="9" cy="9.5" r=".6" fill="currentColor" stroke="none"/><circle cx="15" cy="9.5" r=".6" fill="currentColor" stroke="none"/></svg>
        <span class="label">มีความสุข</span>
      </button>
      <button type="button" class="mood-btn angry" data-mood="angry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 15s1.2-1.2 3.5-1.2 3.5 1.2 3.5 1.2"/><path d="M7.7 8.7l2.6 1.3M16.3 8.7l-2.6 1.3"/></svg>
        <span class="label">โกรธ</span>
      </button>
      <button type="button" class="mood-btn sad" data-mood="sad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 15.8s1.2-1.3 3.5-1.3 3.5 1.3 3.5 1.3"/><circle cx="9" cy="9.5" r=".6" fill="currentColor" stroke="none"/><circle cx="15" cy="9.5" r=".6" fill="currentColor" stroke="none"/></svg>
        <span class="label">เศร้า</span>
      </button>
    </div>

    <p class="hint" id="hint">เลือกอารมณ์ของวันนี้ได้เลย</p>

    <div class="submit-row">
      <button class="submit" id="submitBtn" disabled>บันทึกอารมณ์วันนี้</button>
    </div>

    <p class="footnote">ระบบจะบันทึกได้ 1 ครั้งต่อคนต่อวัน</p>
  </div>

  <div class="success" id="success">
    <div class="success-icon" id="successIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h2>ทำแบบฟอร์มสำเร็จ</h2>
    <p id="successDetail">บันทึกอารมณ์ของวันนี้เรียบร้อยแล้ว<br>ขอบคุณที่แบ่งปันความรู้สึกนะ</p>
  </div>
</div>

<script>
// ====== ตั้งค่า Supabase ======
const SUPABASE_URL = "https://ywvlbaahjxdjwpeetbyy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_lPmrqIlhBX5yryL3AiGMuA_bAR1yqTi";
// ================================

const supabaseClient = (SUPABASE_URL.startsWith("http"))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const moodMeta = {
  calm:  { th: "สงบ",        soft: "var(--calm-soft)",  col: "var(--calm)"  },
  happy: { th: "มีความสุข",  soft: "var(--happy-soft)", col: "var(--happy)" },
  angry: { th: "โกรธ",       soft: "var(--angry-soft)", col: "var(--angry)" },
  sad:   { th: "เศร้า",      soft: "var(--sad-soft)",   col: "var(--sad)"   },
};

let selectedMood = null;

const nameInput = document.getElementById('sname');
const noInput = document.getElementById('sno');
const submitBtn = document.getElementById('submitBtn');
const hint = document.getElementById('hint');
const todayLabel = document.getElementById('todayLabel');

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}

function todayThaiLabel(){
  const days = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
  const months = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  const d = new Date();
  return `วัน${days[d.getDay()]}ที่ ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
}
todayLabel.textContent = todayThaiLabel();

document.querySelectorAll('.mood-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
    validate();
  });
});

function validate(){
  const ok = nameInput.value.trim().length > 0 && noInput.value.trim().length > 0 && selectedMood;
  submitBtn.disabled = !ok;
  hint.classList.remove('error');
  hint.textContent = ok ? "พร้อมบันทึกแล้ว" : "กรอกชื่อ เลขที่ และเลือกอารมณ์ให้ครบ";
}
nameInput.addEventListener('input', validate);
noInput.addEventListener('input', validate);

function localDoneKey(name, no){
  return `mood_done_${todayKey()}_${name.trim()}_${no.trim()}`;
}

function showAlreadyDone(){
  document.getElementById('formWrap').classList.add('hide');
  const succ = document.getElementById('success');
  document.getElementById('successDetail').innerHTML = "วันนี้คุณได้บันทึกอารมณ์ไปแล้ว<br>พบกันใหม่พรุ่งนี้นะ";
  succ.querySelector('h2').textContent = "วันนี้ตอบไปแล้ว";
  succ.classList.add('show');
}

// เช็คเบื้องต้นจากเครื่องนี้ (กันซ้ำแบบเร็ว) — การกันซ้ำจริงอยู่ที่ฐานข้อมูล
function checkLocalPrefillWarning(){
  const name = nameInput.value.trim();
  const no = noInput.value.trim();
  if(name && no && localStorage.getItem(localDoneKey(name,no))){
    hint.classList.add('error');
    hint.textContent = "ดูเหมือนวันนี้คุณตอบไปแล้วจากเครื่องนี้";
  }
}
nameInput.addEventListener('blur', checkLocalPrefillWarning);
noInput.addEventListener('blur', checkLocalPrefillWarning);

submitBtn.addEventListener('click', async ()=>{
  if(!selectedMood) return;
  const name = nameInput.value.trim();
  const no = noInput.value.trim();
  if(!name || !no) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "กำลังบันทึก...";

  if(!supabaseClient){
    hint.classList.add('error');
    hint.textContent = "ยังไม่ได้เชื่อมต่อฐานข้อมูล กรุณาตั้งค่า Supabase ก่อน";
    submitBtn.disabled = false;
    submitBtn.textContent = "บันทึกอารมณ์วันนี้";
    return;
  }

  try{
    const { error } = await supabaseClient
      .from('mood_entries')
      .insert([{ student_name: name, student_no: no, mood: selectedMood, entry_date: todayKey() }]);

    if(error){
      // unique_violation = คนนี้ตอบไปแล้ววันนี้
      if(error.code === '23505'){
        localStorage.setItem(localDoneKey(name,no), '1');
        showAlreadyDone();
        return;
      }
      throw error;
    }

    localStorage.setItem(localDoneKey(name,no), '1');

    // แสดงผลสำเร็จ ปรับสีตามอารมณ์ที่เลือก
    const meta = moodMeta[selectedMood];
    const icon = document.getElementById('successIcon');
    icon.style.background = meta.soft;
    icon.querySelector('svg').style.color = meta.col;
    document.getElementById('successDetail').innerHTML =
      `บันทึกอารมณ์ <strong>${meta.th}</strong> ของวันนี้เรียบร้อยแล้ว<br>ขอบคุณที่แบ่งปันความรู้สึกนะ`;

    document.getElementById('formWrap').classList.add('hide');
    document.getElementById('success').classList.add('show');

  }catch(err){
    console.error(err);
    hint.classList.add('error');
    hint.textContent = "เกิดข้อผิดพลาด ลองใหม่อีกครั้ง";
    submitBtn.disabled = false;
    submitBtn.textContent = "บันทึกอารมณ์วันนี้";
  }
});

// เช็ค localStorage ตอนเปิดหน้า (ถ้าเคยกรอกชื่อ-เลขที่นี้มาก่อนในวันนี้จากเครื่องนี้)
window.addEventListener('DOMContentLoaded', ()=>{
  validate();
});
</script>
</body>
</html>
